<body>

    <div id="workskin">

        <p>here some beginning text just as a placeholder.</p>


        <div class="legal-pad">

            <!-- THE TOP OF THE LEGAL PAD -->
            <div class="pad-top"></div>


            <!-- RED MARGIN -->
            <div class="pad-margin"></div>
        
            <!-- =================================================
         BLUE RULES
         These are BEHIND the writing.
         ================================================= -->

            <div class="pad-rules">

                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>

                <div class="pad-rule"></div>

                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>
                <div class="pad-rule"></div>

            </div>


            <!-- =================================================
         WRITING
         This sits ON TOP of the rules.
         ================================================= -->

            <div class="pad-writing">

                <p class="brian">
                    Those are some very important notes by Brian
                </p>

                <p class="will">
                    this is a comment by Will
                </p>

                <p class="brian">
                    Anohter important note by Brian
                </p>

                <p class="will will-margin">
                    A stupid comment by Will
                </p>

                <p class="brian">
                    And Brian brings it home and tries to go back to the importnat stuff
                </p>

                <p class="will will-note">
                    nerd - Will
                </p>

            </div>

        </div>

    </div>
