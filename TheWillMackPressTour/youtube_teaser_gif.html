<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The WillMack Coming Out Press Tour — Uploading</title>
  <link rel="stylesheet" href="youtube_teaser_gif.css">
</head>

<body>
  <header class="youtube-header">
    <div class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></div>

    <a class="youtube-brand" href="#" aria-label="YouTube home">
      <span class="youtube-logo"><span class="play-triangle"></span></span>
      <img class="youtube-wordmark" src="https://bluishfrog.github.io/hosted/skins/youtube_logo_written.png"
        alt="YouTube">
    </a>

    <div class="search-box" aria-label="Search">
      <span>Search</span>
      <span class="search-button" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </span>
    </div>

    <div class="account-icon">
      <img class="youtube-profile-picture" src="https://bluishfrog.github.io/hosted/TheWillMackPressTour/logo_ao3.png"
        alt="Profile">
    </div>

  </header>

  <main class="upload-page">
    <section class="upload-card" aria-labelledby="video-title">
      <div class="thumbnail" aria-hidden="true">
        <span class="doodle emoji emoji-chicken" aria-label="chicken">🐔</span>
        <span class="doodle emoji emoji-dog" aria-label="dog">🐶</span>
        <span class="doodle emoji emoji-drops" aria-label="three drops">💦</span>
        <span class="doodle emoji emoji-search" aria-label="searching">🧐</span>
        <span class="doodle emoji emoji-house" aria-label="house">🏠</span>
        <span class="doodle emoji emoji-tomato" aria-label="tomato">🍅</span>
        <div class="thumbnail-play"><span class="play-triangle"></span></div>
      </div>

      <h1 id="video-title">The WillMack Coming Out Press Tour</h1>
      <p class="status">Uploading your videos<span class="ellipsis" aria-hidden="true">...</span></p>

      <div class="progress-track" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill"></div>
      </div>
      <p class="percentage" aria-hidden="true"><span class="percentage-number">71.2</span>%</p>

      <div class="spinner" aria-hidden="true"></div>
      <p class="substatus">This may take a few hours.</p>
    </section>
  </main>
</body>

</html>
