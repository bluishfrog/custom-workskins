<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The WillMack Coming Out Press Tour — Uploading</title>
  <link rel="stylesheet" href="youtube_teaser_gif_1.css">
</head>

<body>
  <header class="youtube-header">
    <div class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></div>

    <a class="youtube-brand" href="#" aria-label="YouTube home">
      <span class="youtube-logo"><span class="play-triangle"></span></span>
      <img class="youtube-wordmark" src="https://bluishfrog.github.io/hosted/skins/youtube_logo_written.png"
        alt="YouTube">
    </a>

    <div class="search-box" aria-label="Search">
      <span>Search</span>
      <span class="search-button" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </span>
    </div>

    <div class="account-icon">
      <img class="youtube-profile-picture" src="https://bluishfrog.github.io/hosted/TheWillMackPressTour/logo_ao3.png"
        alt="Profile">
    </div>

  </header>

  <main class="upload-page">
    <section class="upload-card" aria-labelledby="video-title">
      <div class="thumbnail" aria-hidden="true">
        <span class="doodle emoji emoji-chicken" aria-label="chicken">🐔</span>
        <span class="doodle emoji emoji-dog" aria-label="dog">🐶</span>
        <span class="doodle emoji emoji-drops" aria-label="three drops">💦</span>
        <span class="doodle emoji emoji-search" aria-label="searching">🧐</span>
        <span class="doodle emoji emoji-house" aria-label="house">🏠</span>
        <span class="doodle emoji emoji-tomato" aria-label="tomato">🍅</span>
        <div class="thumbnail-play"><span class="play-triangle"></span></div>
      </div>

      <h1 id="video-title">The WillMack Coming Out Press Tour</h1>
      <p class="status">Uploading your videos<span class="ellipsis" aria-hidden="true">...</span></p>

      <div class="progress-track" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill"></div>
      </div>

      <p class="percentage" aria-hidden="true">
        <span class="percentage-number">71.2</span>%
      </p>

      <div class="spinner" aria-hidden="true"></div>
      <p class="substatus">This may take a few hours.</p>
    </section>
  </main>

  
<script>
  const progress = document.querySelector(".progress-fill");
  const number = document.querySelector(".percentage-number");

  const keyframes = [
    { time: 0.00, value: 71.2 },
    { time: 0.25, value: 54.6 },
    { time: 0.48, value: 27.1 },
    { time: 0.73, value: 63.8 },
    { time: 1.00, value: 71.2 }
  ];

  const duration = 10000; // One full cycle: 10 seconds

  // How long to hold at the significant percentages.
  const pauses = {
    0: 700, // 71.2% at the beginning/end
    2: 900  // 27.1% at the minimum
  };

  const start = performance.now();

  // Smoothstep easing: slows down at the start and end
  // of each movement.
  function ease(t) {
    return t * t * (3 - 2 * t);
  }

  function animate(now) {
    const elapsed = (now - start) % duration;
    const cycle = elapsed / duration;

    let i = 0;

    while (
      i < keyframes.length - 2 &&
      cycle >= keyframes[i + 1].time
    ) {
      i++;
    }

    const a = keyframes[i];
    const b = keyframes[i + 1];

    const segmentDuration = (b.time - a.time) * duration;
    const segmentElapsed = (cycle - a.time) * duration;

    // Pause at the important endpoints.
    const pause = pauses[i] || 0;
    const movementDuration = segmentDuration - pause;
    const movingElapsed = Math.max(0, segmentElapsed - pause);

    // Hold at the starting value, then animate toward the next.
    const t = Math.min(1, movingElapsed / movementDuration);
    const eased = ease(t);

    const value = a.value + (b.value - a.value) * eased;

    progress.style.width = value + "%";
    number.textContent = value.toFixed(1);

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>


</body>

</html>
