<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar Test</title>

    <link rel="stylesheet" href="skins/regular_ao3.css">
    <link rel="stylesheet" href="skins/blu_ao3.css">
    <link rel="stylesheet" href="skins/calendar.css">
</head>

<body>

    <div id="workskin">

        <!-- for AO3 copy this level -->

        <div class="calendar-day">
            <details>

                <summary>
                    <div class="calendar-front">

                        <div class="calendar-month">
                            September
                        </div>

                        <div class="calendar-number">
                            21
                        </div>

                        <div class="calendar-weekday">
                            Monday
                        </div>

                    </div>
                </summary>

                <div class="calendar-details">

                    <h3>September 21</h3>

                    <p>
                        A description of what happens on this day.
                    </p>

                    <div class="calendar-event">
                        <div class="calendar-time">
                            14:00
                        </div>
                        Something happens here.
                    </div>

                    <div class="calendar-event">
                        <div class="calendar-time">
                            19:30
                        </div>
                        Something else happens here.
                    </div>

                </div>

            </details>
        </div>



    </div>



</body>

</html>
