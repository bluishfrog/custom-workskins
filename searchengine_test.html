<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Search Mockup</title>

    <link rel="stylesheet" href="skins/searchengine.css">
</head>

<body>

    <main class="search-page">

        <!-- Custom Logo -->
        <header class="logo">
            <div class="logo-mark">S</div>
            <div class="logo-name">Frog Search</div>
        </header>


        <!-- Search Area -->
        <section class="search-section">

            <!-- Currently typed prompt -->
            <div class="search-bar">

                <div class="search-icon">
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                </div>


                <input
                    type="text"
                    id="search-input"
                    value="nhl most back to back cup wins"
                    placeholder="Search..."
                >

                <button class="search-button" type="button">
                    Search
                </button>

            </div>


            <!-- Search history -->
            <div class="search-history" id="search-history">

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">ugreen nas</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">brady knowling</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">connor lockhart</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">cam lund</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">alexander karmanov</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">quentin musty</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">mattias havelid</span>
                </div>

                <div class="history-item">
                    <span class="history-icon">◷</span>
                    <span class="history-text">mack oliphant</span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
